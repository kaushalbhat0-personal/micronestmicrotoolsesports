# Meta-Parser ingestion — controlled multi-game scheduler.
# Game selection travels in the request (matrix value → ?game=), not infra.
# Adding valorant/lol is a matrix data change, not a workflow redesign.
name: meta-parser-ingest

on:
  schedule:
    # Daily 07:00 UTC — after sentinel-retention (04:00) and sentinel-scan (06:00).
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      game:
        description: "Game adapter key (empty = all matrix games)"
        required: false
        default: ""
      backfill:
        description: "Bounded backfill depth, 1-5 (empty = latest only)"
        required: false
        default: ""

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # One game failure never cancels the others.
      fail-fast: false
      matrix:
        # Adding a game is a matrix data change, not a workflow redesign.
        game: ["dota-2", "valorant"]
    steps:
      - name: Trigger Meta-Parser ingestion (${{ matrix.game }})
        run: |
          if [ -n "${{ inputs.game }}" ] && [ "${{ inputs.game }}" != "${{ matrix.game }}" ]; then
            echo "Skipping ${{ matrix.game }} (dispatch scoped to ${{ inputs.game }})"
            exit 0
          fi
          URL="$APP_URL/api/ingest/meta-parser?game=${{ matrix.game }}"
          if [ -n "${{ inputs.backfill }}" ]; then
            URL="$URL&backfill=${{ inputs.backfill }}"
          fi
          curl --fail --show-error --max-time 300 \
            -X POST "$URL" \
            -H "Authorization: Bearer $CRON_SECRET"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
