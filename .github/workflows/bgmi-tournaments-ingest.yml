# BGMI Tournament Hub ingestion — daily standings refresh.
# Source freshness is measured in hours, not minutes: one daily run plus
# manual dispatch while a tournament is actively running. No Vercel Cron,
# no five-minute polling.
name: bgmi-tournaments-ingest

on:
  schedule:
    # Daily 08:00 UTC — one hour after meta-parser-ingest (07:00 UTC).
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      tournament:
        description: "Catalogued tournament slug (empty = each scheduled matrix pair)"
        required: false
        default: ""
      stages:
        description: "Comma-separated stages, e.g. playoffs,grand-finals (empty = each scheduled matrix pair)"
        required: false
        default: ""

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # One leg per automatically tracked tournament stage. A leg failure
      # never cancels the others (per-stage isolation extends to scheduling).
      fail-fast: false
      matrix:
        pair:
          - tournament: bmsd-2026
            stages: grand-finals
          - tournament: bgmi-showdown-2026
            stages: grand-finals
    steps:
      - name: Trigger BGMI Tournament Hub ingestion
        run: |
          TOURNAMENT="${{ inputs.tournament }}"
          if [ -z "$TOURNAMENT" ]; then TOURNAMENT="${{ matrix.pair.tournament }}"; fi
          STAGES="${{ inputs.stages }}"
          if [ -z "$STAGES" ]; then STAGES="${{ matrix.pair.stages }}"; fi
          curl --fail --show-error --max-time 300 \
            -X POST "$APP_URL/api/ingest/bgmi-tournaments?tournament=$TOURNAMENT&stages=$STAGES" \
            -H "Authorization: Bearer $CRON_SECRET"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
